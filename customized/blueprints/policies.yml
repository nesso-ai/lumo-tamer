public-policies:
  lumo-bridge:
    name: Lumo Bridge Policies
    sso: false
    apply-rules: true
    rules:
      # Deny access to any PHP files, because we don't run any PHP applications on our servers
      - action: deny
        match: path
        value: "*.php"
        priority: 20
      # Block all Countries, because we only allow from Hetzner internal Network
      - action: deny
        match: country
        value: ALL
        priority: 100